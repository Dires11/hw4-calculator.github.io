<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Calculator App</title>

    <!-- import the webpage's stylesheet -->
    <link rel="stylesheet" href="style.css">

  </head>
  <body>
    <div class="wrapper">
      <section class="calculator-screen">
        <div class="screen-display">0</div>
      </section>

      <section class="calculator-buttons">
        <button class="btn btn-utility btn-wide" data-action="clear">C</button>
        <button class="btn btn-utility" data-action="backspace">&#8592;</button>
        <button class="btn btn-operator" data-action="operator" data-value="/">&divide;</button>

        <button class="btn btn-digit" data-action="digit" data-value="7">7</button>
        <button class="btn btn-digit" data-action="digit" data-value="8">8</button>
        <button class="btn btn-digit" data-action="digit" data-value="9">9</button>
        <button class="btn btn-operator" data-action="operator" data-value="*">&times;</button>

        <button class="btn btn-digit" data-action="digit" data-value="4">4</button>
        <button class="btn btn-digit" data-action="digit" data-value="5">5</button>
        <button class="btn btn-digit" data-action="digit" data-value="6">6</button>
        <button class="btn btn-operator" data-action="operator" data-value="-">&#8722;</button>

        <button class="btn btn-digit" data-action="digit" data-value="1">1</button>
        <button class="btn btn-digit" data-action="digit" data-value="2">2</button>
        <button class="btn btn-digit" data-action="digit" data-value="3">3</button>
        <button class="btn btn-operator" data-action="operator" data-value="+">&#43;</button>

        <button class="btn btn-digit btn-wide" data-action="digit" data-value="0">0</button>
        <button class="btn btn-operator btn-equals" data-action="equals">&#61;</button>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
